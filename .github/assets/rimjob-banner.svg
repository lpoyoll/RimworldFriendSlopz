<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Rimjob</title>
  <desc id="desc">Rimjob multiplayer mod banner with connected colony hexes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="0.55" stop-color="#202b36"/>
      <stop offset="1" stop-color="#0f141a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2bb66"/>
      <stop offset="1" stop-color="#d97738"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#dfe7ef" stroke-width="1">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
    <path d="M120 0V520M240 0V520M360 0V520M480 0V520M600 0V520M720 0V520M840 0V520M960 0V520M1080 0V520M1200 0V520M1320 0V520M1440 0V520"/>
  </g>
  <g transform="translate(1080 94)" filter="url(#shadow)">
    <path d="M150 0 280 75 280 225 150 300 20 225 20 75Z" fill="#1b2530" stroke="#607181" stroke-width="5"/>
    <path d="M150 44 241 97 241 203 150 256 59 203 59 97Z" fill="#283745" stroke="url(#accent)" stroke-width="7"/>
    <g fill="#edf2f7">
      <rect x="103" y="122" width="48" height="60" rx="4"/>
      <rect x="158" y="92" width="56" height="90" rx="4"/>
      <rect x="82" y="189" width="135" height="12" rx="6" opacity="0.8"/>
    </g>
    <circle cx="280" cy="150" r="13" fill="#f2bb66"/>
    <circle cx="20" cy="150" r="13" fill="#f2bb66"/>
    <path d="M293 150h120" stroke="#f2bb66" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 14"/>
    <path d="M7 150h-120" stroke="#f2bb66" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 14"/>
    <circle cx="430" cy="150" r="36" fill="#293847" stroke="#f2bb66" stroke-width="5"/>
    <circle cx="-130" cy="150" r="36" fill="#293847" stroke="#f2bb66" stroke-width="5"/>
  </g>
  <g transform="translate(96 118)">
    <text x="0" y="122" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="3">RIMJOB</text>
    <rect x="4" y="150" width="560" height="6" rx="3" fill="url(#accent)"/>
    <text x="4" y="213" fill="#d8e0e8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">SHARED WORLD. SEPARATE COLONIES.</text>
    <text x="4" y="263" fill="#9eabb8" font-family="Segoe UI, Arial, sans-serif" font-size="28">Independent multiplayer development by Ignis &amp; Avis</text>
  </g>
</svg>