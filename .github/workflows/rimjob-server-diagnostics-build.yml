name: Rimjob Server Diagnostics Build

on:
  push:
    branches:
      - rimjob-json-runtime-fix
    paths:
      - 'Source/Server/**'
      - '.github/workflows/rimjob-server-diagnostics-build.yml'

permissions:
  contents: read

jobs:
  build-server:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rimjob-json-runtime-fix

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 self-contained server
        shell: pwsh
        run: |
          dotnet publish Source/Server/RTServer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/server

      - name: Verify server output
        shell: pwsh
        run: |
          if (!(Test-Path 'artifacts/server/RTServer.exe')) { throw 'RTServer.exe was not produced' }
          Get-ChildItem artifacts/server | Select-Object Name, Length

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.7-server-diagnostics-win-x64
          path: artifacts/server
          if-no-files-found: error
          retention-days: 3
