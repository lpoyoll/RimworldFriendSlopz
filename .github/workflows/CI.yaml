name: Validate Rimjob

on:
  push:
    branches: [development, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test same-tile session routing
        run: dotnet test Source/Server.Tests/RTServer.Tests.csproj --configuration Release
      - name: Build server
        run: dotnet build Source/Server/RTServer.csproj --configuration Release
      - name: Publish Windows server
        run: >-
          dotnet publish Source/Server/RTServer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/server-win-x64
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:DebugSymbols=false
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: rimjob-server-win-x64
          path: artifacts/server-win-x64
          if-no-files-found: error
      - name: Build shared-colony client patch
        run: dotnet build Source/SharedColony/SharedColony.csproj --configuration Release
      - name: Upload shared-colony client patch
        uses: actions/upload-artifact@v4
        with:
          name: rimjob-shared-colony-client
          path: 1.6/Assemblies/Rimjob.SharedColony.dll
          if-no-files-found: error
