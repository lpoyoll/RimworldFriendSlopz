name: Create and publish a Docker image

# Runs on every push to the 'release' branch, and whenever
# a non-prerelease GitHub Release is published.

on:
	push:
		branches: ['release']
	release:
		types: [published]

# Custom environment variables used throughout the workflow:
# the registry domain, and the image name.
# (defaults to the GitHub repo name).
env:
	REGISTRY: ghcr.io
	IMAGE_NAME: ${{ github.repository }}

jobs:
	build-and-push-image:
		# Skip prerelease Github Releases. This condition only applies
		# to the 'release' trigger - 'github.event.release' doesn't
		# exist on 'push' event, so we guard on event_name first
		# to avoid evaluating it there.
		if: github.event_name != 'release' || !github.event.release.prerelease
		runs-on: ubuntu-latest
	
		# Permissions granted to GITHUB_TOKEN for this job.
		permissions:
			contents: read
			packages: write
			attestations: write
			id-token: write
	
		steps:
			- name: Checkout repository
			  uses: action/checkout@v7
		
		# Explicit Buildx setup - gives predictable caching/multi-platform
		# behaviour instead of relying on build-push-action's auto-create.
		- name: Set up Docker Buildx
		  uses: docker/setup-buildx-action@v4
		
		# Log in to GHCR using the built-in GITHUB_Token - no extra secrets
		# need to be configured. Published images are scoped to this repo/org.
		- name: Log in to the Container registry
		  uses: docker/login-action@v4
		  with:
			  registry: ${{ env.REGISTRY }}
			  username: ${{ github.actor }}
			  password: ${{ secrets.GITHUB_TOKEN }}
		
		# Extract tags/labels for the image based on the git ref / release.
		- name: Extract metadata (tags, labels) for Docker
		  id: meta
		  uses: docker/metadata-action@v6
		  with:
			  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
		
		# Build the image from the repo's Dockerfile and push it to GHCR.
		# GitHub Actions cache speeds up rebuilds when base layers haven't
		# changed.
		- name: Build and push Docker image
		  id: push
		  uses: docker/build-push-action@v7
		  with:
			  context: .
			  push: true
			  tags: ${{ steps.meta.outputs.tags }}
			  labels: ${{ steps.meta.outputs.labels }}
			  cache-from: type=gha
			  cache-to: type=gha, mode = max
		
		# Generate a build provenance attestation for the published image,
		# giving consumers an unforgeable record of how/where it was built.
		-name: Generate artifact attestation
		uses: actions/attest@v4
		with:
			subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
			subject-digest: ${{ steps.push.outputs.digest }}
			push-to-registry: true