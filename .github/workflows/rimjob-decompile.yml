name: Rimjob RTClient Local Install Fix

on:
  push:
    branches:
      - rimjob-json-runtime-fix
    paths:
      - '.github/workflows/rimjob-decompile.yml'

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rimjob-json-runtime-fix

      - name: Install ILSpy command line
        run: dotnet tool install --global ilspycmd

      - name: Create dnlib patcher
        run: |
          set -euxo pipefail
          mkdir -p /tmp/patcher
          cd /tmp/patcher
          dotnet new console --framework net8.0 --force
          dotnet add package dnlib --version 4.5.0
          cat > Program.cs <<'CS'
          using System;
          using System.Linq;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          using dnlib.DotNet.Writer;

          if (args.Length != 2)
              throw new ArgumentException("Usage: patcher <input> <output>");

          var input = args[0];
          var output = args[1];
          using var module = ModuleDefMD.Load(input);
          var type = module.Types.First(t => t.FullName == "RTClient.Core.Program");
          var method = type.Methods.First(m => m.Name == "CheckStructure" && m.Parameters.Count == 0);

          method.Body.Instructions.Clear();
          method.Body.ExceptionHandlers.Clear();
          method.Body.Variables.Clear();
          method.Body.InitLocals = false;
          method.Body.Instructions.Add(OpCodes.Ldc_I4_1.ToInstruction());
          method.Body.Instructions.Add(OpCodes.Ret.ToInstruction());

          var options = new ModuleWriterOptions(module);
          module.Write(output, options);
          Console.WriteLine("Patched RTClient.Core.Program.CheckStructure() to allow local installs.");
          CS
          dotnet build -c Release

      - name: Patch and verify RTClient
        run: |
          set -euxo pipefail
          dotnet /tmp/patcher/bin/Release/net8.0/patcher.dll Source/Assemblies/RTClient.dll /tmp/RTClient.dll
          test -s /tmp/RTClient.dll
          ilspycmd -t RTClient.Core.Program /tmp/RTClient.dll > /tmp/Program.cs
          grep -A8 -B2 'CheckStructure' /tmp/Program.cs
          grep -A5 'bool CheckStructure' /tmp/Program.cs | grep 'return true'
          sha256sum Source/Assemblies/RTClient.dll /tmp/RTClient.dll > /tmp/RTClient-sha256.txt

      - name: Commit patched RTClient to branch
        run: |
          set -euxo pipefail
          cp /tmp/RTClient.dll Source/Assemblies/RTClient.dll
          git config user.name 'Rimjob Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Source/Assemblies/RTClient.dll
          git commit -m 'Allow RTClient to initialise from local Rimjob folder'
          git push origin HEAD:rimjob-json-runtime-fix

      - name: Upload patched RTClient
        uses: actions/upload-artifact@v4
        with:
          name: RTClient-local-install-fixed
          path: |
            /tmp/RTClient.dll
            /tmp/RTClient-sha256.txt
            /tmp/Program.cs
          if-no-files-found: error
          retention-days: 1
