name: Rimjob Release - ZIP and MSI

on:
  push:
    branches:
      - rimjob-v013-live-sync
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.13
  RELEASE_TAG: v0.1.13
  KNOWN_GOOD_RTCLIENT_COMMIT: a65ef0fea5911ac710a50f53b9fcad8a2f32051f
  KNOWN_GOOD_RTCLIENT_SHA256: 71ca7388932621254ab8f7300b7d6ff182a218e7ba4cad052ea8f8fb9328b541
  KNOWN_GOOD_RTCLIENT_SIZE: 312832

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Rimjob client companion
        shell: pwsh
        run: |
          dotnet build Source/SharedColonyClient/SharedColonyClient.csproj -c Release
          $dll = 'Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll'
          if (!(Test-Path $dll)) { throw 'RWTSharedColony.dll was not produced' }

      - name: Build Mono-compatible client dependency bundle
        shell: pwsh
        run: |
          dotnet build Source/ClientRuntimeDeps/ClientRuntimeDeps.csproj -c Release
          $deps = 'Source/ClientRuntimeDeps/bin/Release/net472'
          foreach ($required in @('Newtonsoft.Json.dll','DiscordRPC.dll','MessagePack.dll','MessagePack.Annotations.dll')) {
            if (!(Test-Path (Join-Path $deps $required))) { throw "Missing client dependency: $required" }
          }

      - name: Publish single-file Rimjob Server
        shell: pwsh
        run: |
          dotnet publish Source/Server/RTServer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/server-publish

          New-Item -ItemType Directory -Force build/server | Out-Null
          if (!(Test-Path 'build/server-publish/RTServer.exe')) { throw 'RTServer.exe was not produced' }
          Copy-Item 'build/server-publish/RTServer.exe' 'build/server/Rimjob Server.exe'

      - name: Stage and verify Rimjob client
        shell: pwsh
        run: |
          $client = 'build/client'
          New-Item -ItemType Directory -Force "$client/1.6/Assemblies" | Out-Null

          Copy-Item About "$client/About" -Recurse
          Copy-Item 1.6/Defs "$client/1.6/Defs" -Recurse
          Copy-Item 1.6/Languages "$client/1.6/Languages" -Recurse
          Copy-Item 1.6/Sounds "$client/1.6/Sounds" -Recurse
          Copy-Item 1.6/Textures "$client/1.6/Textures" -Recurse
          Copy-Item LoadFolders.xml, LICENSE $client

          # Keep the known-good client that restores Direct Connect / Server Browser.
          $rtClient = "$client/1.6/Assemblies/RTClient.dll"
          $rtClientUrl = "https://raw.githubusercontent.com/lpoyoll/RimworldFriendSlopz/$env:KNOWN_GOOD_RTCLIENT_COMMIT/Source/Assemblies/RTClient.dll"
          Invoke-WebRequest -Uri $rtClientUrl -OutFile $rtClient

          Copy-Item Source/Assemblies/RTNetwork.dll "$client/1.6/Assemblies/RTNetwork.dll"
          Copy-Item Source/Assemblies/RTShared.dll "$client/1.6/Assemblies/RTShared.dll"
          Copy-Item Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll "$client/1.6/Assemblies/RWTSharedColony.dll"

          Get-ChildItem Source/ClientRuntimeDeps/bin/Release/net472 -Filter '*.dll' |
            Where-Object { $_.Name -ne 'Rimjob.ClientRuntimeDeps.dll' } |
            Copy-Item -Destination "$client/1.6/Assemblies"

          $rtInfo = Get-Item $rtClient
          if ($rtInfo.Length -ne [int64]$env:KNOWN_GOOD_RTCLIENT_SIZE) {
            throw "Wrong RTClient.dll size: $($rtInfo.Length); expected $env:KNOWN_GOOD_RTCLIENT_SIZE"
          }
          $rtHash = (Get-FileHash $rtClient -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rtHash -ne $env:KNOWN_GOOD_RTCLIENT_SHA256.ToLowerInvariant()) {
            throw "Wrong RTClient.dll SHA256: $rtHash"
          }

          $about = Get-Content "$client/About/About.xml" -Raw
          if ($about -notmatch '<name>Rimjob</name>' -or $about -notmatch 'Ignis &amp; Avis') {
            throw 'Rimjob About.xml branding is incorrect'
          }

          $patch = Get-Content 'Source/SharedColonyClient/SharedTileSettlementPatch.cs' -Raw
          foreach ($requiredPatchText in @('Page_SelectStartingSite','PromoteSelectedSharedTile','Find.GameInitData','IsExplicitlySelectedTile','public static void Postfix','HarmonyPriority(Priority.Last)')) {
            if ($patch -notmatch [regex]::Escape($requiredPatchText)) {
              throw "Shared first-settlement patch is missing: $requiredPatchText"
            }
          }
          if ($patch -match 'Current\.ProgramState\s*==\s*ProgramState\.Playing') {
            throw 'Regression: shared starting-site validation must not require ProgramState.Playing'
          }

          $liveSync = Get-Content 'Source/SharedColonyClient/SharedTileLiveSync.cs' -Raw
          foreach ($requiredLiveSyncText in @(
            'host-authoritative shared map',
            'CaptureSelectedTarget',
            'PKT_Synchronous.StepMode.Ask',
            'MapSaveLoader.MapToString',
            'MapSaveLoader.StringToMap',
            'SessionManager.SynchronousMap',
            'DebugSetTicksGame',
            'ClockResyncIntervalTicks',
            'RemotePawnJobAuthorityPatch'
          )) {
            if ($liveSync -notmatch [regex]::Escape($requiredLiveSyncText)) {
              throw "Shared live-map implementation is missing: $requiredLiveSyncText"
            }
          }

          $unicodeText = [System.Text.Encoding]::Unicode.GetString([System.IO.File]::ReadAllBytes($rtClient))
          foreach ($requiredText in @('Direct Connect','Server Browser')) {
            if (-not $unicodeText.Contains($requiredText)) {
              throw "Pinned RTClient.dll does not contain required multiplayer menu text: $requiredText"
            }
          }

          Write-Host "Pinned Direct Connect RTClient verified: $($rtInfo.Length) bytes / $rtHash"

      - name: Build and verify flat ZIP release
        shell: pwsh
        run: |
          $root = 'build/release'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$root/Rimjob", "$root/Server" | Out-Null
          Copy-Item 'build/client/*' "$root/Rimjob" -Recurse
          Copy-Item 'build/server/Rimjob Server.exe' "$root/Server/Rimjob Server.exe"

          @"
          RIMJOB v$env:RELEASE_VERSION

          CLIENT
          Copy the top-level Rimjob folder directly to <RimWorld>\Mods\Rimjob, or use the MSI installer.
          Harmony is required. Disable the original RimWorld Together Workshop mod.

          Shared-tile joins now replace the joining player's independently generated map with the live host snapshot and start RimWorld Together synchronous mode automatically. The host clock is authoritative.

          SERVER
          The Server folder contains a self-contained Rimjob Server.exe.
          The MSI makes this an optional host-only component and installs it to Desktop\Rimjob Server.
          "@ | Set-Content "$root/INSTALL.txt"

          $zip = "build/Rimjob-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal

          $verify = 'build/verify-zip'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $verify

          foreach ($requiredPath in @(
            "$verify/Rimjob/About/About.xml",
            "$verify/Rimjob/LoadFolders.xml",
            "$verify/Rimjob/1.6/Assemblies/RTClient.dll",
            "$verify/Rimjob/1.6/Assemblies/RWTSharedColony.dll",
            "$verify/Server/Rimjob Server.exe"
          )) {
            if (!(Test-Path $requiredPath)) { throw "ZIP verification failed. Missing: $requiredPath" }
          }

          $zipClient = "$verify/Rimjob/1.6/Assemblies/RTClient.dll"
          $zipInfo = Get-Item $zipClient
          if ($zipInfo.Length -ne [int64]$env:KNOWN_GOOD_RTCLIENT_SIZE) {
            throw "ZIP contains wrong RTClient.dll size: $($zipInfo.Length)"
          }
          $zipHash = (Get-FileHash $zipClient -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:KNOWN_GOOD_RTCLIENT_SHA256.ToLowerInvariant()) {
            throw "ZIP contains wrong RTClient.dll SHA256: $zipHash"
          }

          $stagedHash = (Get-FileHash 'build/client/1.6/Assemblies/RTClient.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($stagedHash -ne $zipHash) { throw 'ZIP RTClient.dll does not match the MSI client payload source' }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI installer
        shell: pwsh
        run: |
          $clientPath = (Resolve-Path 'build/client').Path
          $serverPath = (Resolve-Path 'build/server').Path
          $installerPath = (Resolve-Path 'Installer').Path
          $msi = "build/Rimjob-v$env:RELEASE_VERSION-x64.msi"

          wix build Installer/Rimjob.wxs `
            -arch x64 `
            -culture en-US `
            -ext WixToolset.UI.wixext `
            -bindpath "ClientPayload=$clientPath" `
            -bindpath "ServerPayload=$serverPath" `
            -bindpath "InstallerAssets=$installerPath" `
            -out $msi

          if (!(Test-Path $msi)) { throw 'MSI was not produced' }

      - name: Upload ZIP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.13-ZIP
          path: build/Rimjob-v0.1.13.zip
          if-no-files-found: error

      - name: Upload MSI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.13-MSI
          path: build/Rimjob-v0.1.13-x64.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.13
          target_commitish: ${{ github.sha }}
          name: Rimjob v0.1.13
          body: |
            Rimjob v0.1.13

            - Same-tile settlement is no longer just an occupancy exception. A joining player now automatically requests the existing player's live map after new-game generation.
            - The host sends the authoritative map snapshot; the guest discards the independently generated tile contents and loads that snapshot instead.
            - The joining player's own pawns are preserved and inserted into the host map at host-selected safe positions, while the other player's pawns and owned things are represented as a separate remote-player faction.
            - Remote player pawns remain non-controllable and their jobs originate from their owning client rather than autonomous mirror AI.
            - RimWorld Together synchronous mode starts automatically for the shared tile so pawn jobs/drafts and the existing synchronous action channels are routed between the two clients.
            - Host game time is authoritative at join and is re-published every 60 ticks to correct guest clock drift.
            - Carries forward the v0.1.12 exact Direct Connect / Server Browser RTClient pin and all Mono-compatible runtime dependencies.
            - This is the first live shared-map implementation. The current RWT synchronous transport is still pair-based, so validate the two-player host/guest flow before extending simultaneous live occupancy to 3-4 players.

            Rimjob is developed independently by Ignis & Avis. It originated from the RimWorld Together codebase; credit remains with that project's maintainers and contributors for inherited work.
          files: |
            build/Rimjob-v0.1.13.zip
            build/Rimjob-v0.1.13-x64.msi
          overwrite_files: true
