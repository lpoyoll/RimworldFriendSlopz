name: Rimjob v0.1.17 - ZIP and MSI

on:
  push:
    branches:
      - rimjob-v017-diagnostics-updater
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.17
  RELEASE_TAG: v0.1.17
  KNOWN_GOOD_RTCLIENT_COMMIT: a65ef0fea5911ac710a50f53b9fcad8a2f32051f
  KNOWN_GOOD_RTCLIENT_SHA256: 71ca7388932621254ab8f7300b7d6ff182a218e7ba4cad052ea8f8fb9328b541
  KNOWN_GOOD_RTCLIENT_SIZE: 312832

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Rimjob client companion
        shell: pwsh
        run: |
          dotnet build Source/SharedColonyClient/SharedColonyClient.csproj -c Release
          if (!(Test-Path 'Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll')) { throw 'RWTSharedColony.dll was not produced' }

      - name: Verify v0.1.17 diagnostics source
        shell: pwsh
        run: |
          $diag = Get-Content 'Source/SharedColonyClient/ClientDiagnostics.cs' -Raw
          foreach ($required in @('KeyCode.F9','Verbose Log','Action rejected','kind == "ERROR"','Client diagnostics initialised','RimjobVerboseResponseShortcutPatch')) {
            if ($diag -notmatch [regex]::Escape($required)) { throw "Missing v0.1.17 client diagnostics element: $required" }
          }
          $trace = Get-Content 'Source/SharedColonyClient/SharedTileDiagnosticTracing.cs' -Raw
          if ($trace -notmatch 'Checking existing tile session') { throw 'Missing existing tile client trace' }
          $login = Get-Content 'Source/Server/PacketManagers/PM_Login.cs' -Raw
          if ($login -notmatch '\[SHARED-CHECK\]') { throw 'Missing server existing-tile check logging' }
          $sync = Get-Content 'Source/Server/PacketManagers/PM_Synchronous.cs' -Raw
          foreach ($required in @('[SYNC] Session lookup','[SYNC] Target resolved','SendUnavailablePacket(client','SendUserUnavailablePacket(client')) {
            if ($sync -notmatch [regex]::Escape($required)) { throw "Missing server sync diagnostic: $required" }
          }
          $shortcut = Get-Content 'Source/Server/Managers/ResponseShortcutManager.cs' -Raw
          foreach ($required in @('|ERROR|','[ACTION-DENY]','SendDiagnostic')) {
            if ($shortcut -notmatch [regex]::Escape($required)) { throw "Missing detailed action rejection transport: $required" }
          }

      - name: Build one-click client updater
        shell: pwsh
        run: |
          dotnet build Source/Updater/Rimjob.Updater.csproj -c Release
          $updater = 'Source/Updater/bin/Release/net472/Update.exe'
          if (!(Test-Path $updater)) { throw 'Update.exe was not produced' }
          $source = Get-Content 'Source/Updater/Program.cs' -Raw
          foreach ($required in @('releases/latest','SafeExtract','RimjobUpdater','SHA256','All client-side mod files were replaced')) {
            if ($source -notmatch [regex]::Escape($required)) { throw "Missing updater safety element: $required" }
          }

      - name: Build Mono-compatible client dependencies
        shell: pwsh
        run: |
          dotnet build Source/ClientRuntimeDeps/ClientRuntimeDeps.csproj -c Release
          $deps = 'Source/ClientRuntimeDeps/bin/Release/net472'
          foreach ($required in @('Newtonsoft.Json.dll','DiscordRPC.dll','MessagePack.dll','MessagePack.Annotations.dll')) {
            if (!(Test-Path (Join-Path $deps $required))) { throw "Missing client dependency: $required" }
          }

      - name: Publish single-file Rimjob Server
        shell: pwsh
        run: |
          dotnet publish Source/Server/RTServer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o build/server-publish
          New-Item -ItemType Directory -Force build/server | Out-Null
          if (!(Test-Path 'build/server-publish/RTServer.exe')) { throw 'RTServer.exe was not produced' }
          Copy-Item 'build/server-publish/RTServer.exe' 'build/server/Rimjob Server.exe'

      - name: Stage client
        shell: pwsh
        run: |
          $client = 'build/client'
          New-Item -ItemType Directory -Force "$client/1.6/Assemblies" | Out-Null
          Copy-Item About "$client/About" -Recurse
          Copy-Item 1.6/Defs "$client/1.6/Defs" -Recurse
          Copy-Item 1.6/Languages "$client/1.6/Languages" -Recurse
          Copy-Item 1.6/Sounds "$client/1.6/Sounds" -Recurse
          Copy-Item 1.6/Textures "$client/1.6/Textures" -Recurse
          Copy-Item LoadFolders.xml, LICENSE $client

          $rtClient = "$client/1.6/Assemblies/RTClient.dll"
          $rtClientUrl = "https://raw.githubusercontent.com/lpoyoll/RimworldFriendSlopz/$env:KNOWN_GOOD_RTCLIENT_COMMIT/Source/Assemblies/RTClient.dll"
          Invoke-WebRequest -Uri $rtClientUrl -OutFile $rtClient
          Copy-Item Source/Assemblies/RTNetwork.dll "$client/1.6/Assemblies/RTNetwork.dll"
          Copy-Item Source/Assemblies/RTShared.dll "$client/1.6/Assemblies/RTShared.dll"
          Copy-Item Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll "$client/1.6/Assemblies/RWTSharedColony.dll"
          Get-ChildItem Source/ClientRuntimeDeps/bin/Release/net472 -Filter '*.dll' |
            Where-Object { $_.Name -ne 'Rimjob.ClientRuntimeDeps.dll' } |
            Copy-Item -Destination "$client/1.6/Assemblies"

          Copy-Item 'Source/Updater/bin/Release/net472/Update.exe' "$client/Update.exe"
          Set-Content "$client/VERSION.txt" $env:RELEASE_VERSION -NoNewline

          $rtInfo = Get-Item $rtClient
          if ($rtInfo.Length -ne [int64]$env:KNOWN_GOOD_RTCLIENT_SIZE) { throw "Wrong RTClient.dll size: $($rtInfo.Length)" }
          $rtHash = (Get-FileHash $rtClient -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rtHash -ne $env:KNOWN_GOOD_RTCLIENT_SHA256.ToLowerInvariant()) { throw "Wrong RTClient.dll SHA256: $rtHash" }
          if (!(Test-Path "$client/Update.exe")) { throw 'Staged client is missing Update.exe' }

      - name: Build and verify ZIP
        shell: pwsh
        run: |
          $root = 'build/release'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$root/Rimjob", "$root/Server" | Out-Null
          Copy-Item 'build/client/*' "$root/Rimjob" -Recurse
          Copy-Item 'build/server/Rimjob Server.exe' "$root/Server/Rimjob Server.exe"
          @"
          RIMJOB v$env:RELEASE_VERSION

          CLIENT
          Install Rimjob into <RimWorld>\Mods\Rimjob or use the MSI.
          F9 opens Rimjob Diagnostics. The Verbose Log tab can enable persistent verbose client tracing.
          Action rejection dialogs now include the server's reason and client/session state where available.
          Run Rimjob\Update.exe to check GitHub Releases and replace all Rimjob client files with the latest published client.

          SERVER
          Run with verbosity 2 for [SHARED-CHECK], [SHARED-SESSION], [SYNC], and [ACTION-DENY] diagnostics.
          The Server folder contains the self-contained server; MSI server installation remains optional.
          "@ | Set-Content "$root/INSTALL.txt"

          $zip = "build/Rimjob-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $verify = 'build/verify-zip'
          Expand-Archive $zip $verify
          foreach ($required in @(
            "$verify/Rimjob/About/About.xml",
            "$verify/Rimjob/1.6/Assemblies/RTClient.dll",
            "$verify/Rimjob/1.6/Assemblies/RWTSharedColony.dll",
            "$verify/Rimjob/Update.exe",
            "$verify/Rimjob/VERSION.txt",
            "$verify/Server/Rimjob Server.exe"
          )) { if (!(Test-Path $required)) { throw "ZIP missing $required" } }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $clientPath = (Resolve-Path 'build/client').Path
          $serverPath = (Resolve-Path 'build/server').Path
          $installerPath = (Resolve-Path 'Installer').Path
          wix build Installer/Rimjob.wxs `
            -arch x64 -culture en-US -ext WixToolset.UI.wixext `
            -bindpath "ClientPayload=$clientPath" `
            -bindpath "ServerPayload=$serverPath" `
            -bindpath "InstallerAssets=$installerPath" `
            -out "build/Rimjob-v$env:RELEASE_VERSION-x64.msi"
          if (!(Test-Path "build/Rimjob-v$env:RELEASE_VERSION-x64.msi")) { throw 'MSI was not produced' }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.17-ZIP
          path: build/Rimjob-v0.1.17.zip
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.17-MSI
          path: build/Rimjob-v0.1.17-x64.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.17
          target_commitish: ${{ github.sha }}
          name: Rimjob v0.1.17
          body: |
            Rimjob v0.1.17

            - Adds explicit server-side existing shared-tile checks at verbosity 2: [SHARED-CHECK], [SHARED-SESSION] and [SYNC].
            - Generic client errors such as "Action is not currently available" now include the server reason, server context and current client/session state when available.
            - F9 opens Rimjob Diagnostics with Session, Network and Verbose Log tabs.
            - Verbose client logging is persistent and writes a dedicated Rimjob client log outside the mod folder.
            - Adds Rimjob/Update.exe. Run it to check GitHub Releases and atomically replace all client-side Rimjob files with the latest published ZIP.
            - Update.exe verifies GitHub's SHA256 digest when supplied, rejects unsafe ZIP paths, refuses to update while RimWorld is running, and restores the previous client folder if replacement fails.
            - Carries forward v0.1.16 existing shared-tile rejoin behaviour and the known-good Direct Connect / Server Browser RTClient.

            Both clients and the server should use v0.1.17 for the new diagnostic protocol.
          files: |
            build/Rimjob-v0.1.17.zip
            build/Rimjob-v0.1.17-x64.msi
          overwrite_files: true
