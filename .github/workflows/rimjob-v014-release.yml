name: Rimjob v0.1.14 - ZIP and MSI

on:
  push:
    branches:
      - rimjob-v014-live-sync-handshake
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.14
  RELEASE_TAG: v0.1.14
  KNOWN_GOOD_RTCLIENT_COMMIT: a65ef0fea5911ac710a50f53b9fcad8a2f32051f
  KNOWN_GOOD_RTCLIENT_SHA256: 71ca7388932621254ab8f7300b7d6ff182a218e7ba4cad052ea8f8fb9328b541
  KNOWN_GOOD_RTCLIENT_SIZE: 312832

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Rimjob client companion
        shell: pwsh
        run: |
          dotnet build Source/SharedColonyClient/SharedColonyClient.csproj -c Release
          if (!(Test-Path 'Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll')) {
            throw 'RWTSharedColony.dll was not produced'
          }

      - name: Verify v0.1.14 handshake source
        shell: pwsh
        run: |
          $fix = Get-Content 'Source/SharedColonyClient/SharedTileLiveSyncHandshakeFix.cs' -Raw
          foreach ($required in @(
            'waiting for server settlement acknowledgement',
            'SETTLED',
            'DelaySharedTileJoinUntilSettlementAckPatch',
            'RecoverSharedTileTargetPatch',
            'SharedTileLiveSync.BeginPendingJoin'
          )) {
            if ($fix -notmatch [regex]::Escape($required)) { throw "Missing v0.1.14 client handshake element: $required" }
          }

          $server = Get-Content 'Source/Server/PacketManagers/PM_Settlements.cs' -Raw
          foreach ($required in @('SendProtocolMessage','|SETTLED|','SharedColonyManager.RegisterSettlement')) {
            if ($server -notmatch [regex]::Escape($required)) { throw "Missing v0.1.14 server acknowledgement element: $required" }
          }

      - name: Build Mono-compatible client dependencies
        shell: pwsh
        run: |
          dotnet build Source/ClientRuntimeDeps/ClientRuntimeDeps.csproj -c Release
          $deps = 'Source/ClientRuntimeDeps/bin/Release/net472'
          foreach ($required in @('Newtonsoft.Json.dll','DiscordRPC.dll','MessagePack.dll','MessagePack.Annotations.dll')) {
            if (!(Test-Path (Join-Path $deps $required))) { throw "Missing client dependency: $required" }
          }

      - name: Publish single-file Rimjob Server
        shell: pwsh
        run: |
          dotnet publish Source/Server/RTServer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/server-publish

          New-Item -ItemType Directory -Force build/server | Out-Null
          Copy-Item 'build/server-publish/RTServer.exe' 'build/server/Rimjob Server.exe'

      - name: Stage client
        shell: pwsh
        run: |
          $client = 'build/client'
          New-Item -ItemType Directory -Force "$client/1.6/Assemblies" | Out-Null
          Copy-Item About "$client/About" -Recurse
          Copy-Item 1.6/Defs "$client/1.6/Defs" -Recurse
          Copy-Item 1.6/Languages "$client/1.6/Languages" -Recurse
          Copy-Item 1.6/Sounds "$client/1.6/Sounds" -Recurse
          Copy-Item 1.6/Textures "$client/1.6/Textures" -Recurse
          Copy-Item LoadFolders.xml, LICENSE $client

          $rtClient = "$client/1.6/Assemblies/RTClient.dll"
          $rtClientUrl = "https://raw.githubusercontent.com/lpoyoll/RimworldFriendSlopz/$env:KNOWN_GOOD_RTCLIENT_COMMIT/Source/Assemblies/RTClient.dll"
          Invoke-WebRequest -Uri $rtClientUrl -OutFile $rtClient
          Copy-Item Source/Assemblies/RTNetwork.dll "$client/1.6/Assemblies/RTNetwork.dll"
          Copy-Item Source/Assemblies/RTShared.dll "$client/1.6/Assemblies/RTShared.dll"
          Copy-Item Source/SharedColonyClient/bin/Release/net472/RWTSharedColony.dll "$client/1.6/Assemblies/RWTSharedColony.dll"
          Get-ChildItem Source/ClientRuntimeDeps/bin/Release/net472 -Filter '*.dll' |
            Where-Object { $_.Name -ne 'Rimjob.ClientRuntimeDeps.dll' } |
            Copy-Item -Destination "$client/1.6/Assemblies"

          $rtInfo = Get-Item $rtClient
          if ($rtInfo.Length -ne [int64]$env:KNOWN_GOOD_RTCLIENT_SIZE) { throw "Wrong RTClient.dll size: $($rtInfo.Length)" }
          $rtHash = (Get-FileHash $rtClient -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rtHash -ne $env:KNOWN_GOOD_RTCLIENT_SHA256.ToLowerInvariant()) { throw "Wrong RTClient.dll SHA256: $rtHash" }

      - name: Build ZIP
        shell: pwsh
        run: |
          $root = 'build/release'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$root/Rimjob", "$root/Server" | Out-Null
          Copy-Item 'build/client/*' "$root/Rimjob" -Recurse
          Copy-Item 'build/server/Rimjob Server.exe' "$root/Server/Rimjob Server.exe"

          @"
          RIMJOB v$env:RELEASE_VERSION

          v0.1.14 fixes the shared-map handover race found in v0.1.13.
          The joining client now waits for an explicit server acknowledgement that
          its settlement exists before it asks the existing tile owner for the live map.
          It also recovers the host settlement owner from the selected/starting tile
          if RimWorld has already cleared FirstSelectedObject.

          Install the Rimjob folder into <RimWorld>\Mods\Rimjob and disable the
          original RimWorld Together Workshop mod. Both players and the server
          must use this release for the shared-map handshake test.
          "@ | Set-Content "$root/INSTALL.txt"

          $zip = "build/Rimjob-v$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $clientPath = (Resolve-Path 'build/client').Path
          $serverPath = (Resolve-Path 'build/server').Path
          $installerPath = (Resolve-Path 'Installer').Path
          wix build Installer/Rimjob.wxs `
            -arch x64 `
            -culture en-US `
            -ext WixToolset.UI.wixext `
            -bindpath "ClientPayload=$clientPath" `
            -bindpath "ServerPayload=$serverPath" `
            -bindpath "InstallerAssets=$installerPath" `
            -out "build/Rimjob-v$env:RELEASE_VERSION-x64.msi"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.14-ZIP
          path: build/Rimjob-v0.1.14.zip
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Rimjob-v0.1.14-MSI
          path: build/Rimjob-v0.1.14-x64.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.14
          target_commitish: ${{ github.sha }}
          name: Rimjob v0.1.14
          body: |
            Rimjob v0.1.14

            - Fixes the v0.1.13 same-tile live-map handshake race.
            - The server now acknowledges the joining player's settlement only after it has been registered.
            - The client waits for that acknowledgement before sending the synchronous same-tile map request.
            - Adds a fallback resolver for the existing RTSettlement owner when the world selector no longer exposes FirstSelectedObject.
            - Carries forward host-authoritative map transfer, guest pawn insertion, remote pawn ownership, synchronous action routing and host-authoritative time from v0.1.13.
            - Carries forward the known-good Direct Connect / Server Browser RTClient binary.

            Test with two players first. Both clients and the server must be v0.1.14.
          files: |
            build/Rimjob-v0.1.14.zip
            build/Rimjob-v0.1.14-x64.msi
          overwrite_files: true
