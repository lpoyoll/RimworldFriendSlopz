<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9ced3; overflow: hidden; font-family: system-ui, sans-serif; }
  #labels div { position: absolute; transform: translate(-50%, -100%); color: #fff; background: rgba(20,24,30,.72);
    padding: 3px 8px; border-radius: 3px; font-size: 13px; white-space: nowrap; pointer-events: none; }
  #caption { position: absolute; left: 12px; bottom: 10px; color: #1d2126; background: rgba(255,255,255,.8);
    padding: 6px 10px; border-radius: 3px; font-size: 12px; line-height: 1.4; max-width: 70%; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<div id="caption">__TITLE__ · RESPONSE pipeline preview (not the game render) · Terrain, heights &amp; trees: EA LiDAR 1 m ·
Buildings: OS OpenMap Local, OS Open UPRN · Roads: OS Open Roads, © OpenStreetMap contributors · Contains OS data © Crown copyright and database right</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const S = __SCENE__;
const CAM = __CAMERA__;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9ced3);   // Tameside overcast
scene.fog = new THREE.Fog(0xc9ced3, 180, 520);

const camera = new THREE.PerspectiveCamera(CAM.fov || 45, innerWidth / innerHeight, 0.5, 2000);
camera.position.fromArray(CAM.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.fromArray(CAM.target);
controls.update();

scene.add(new THREE.HemisphereLight(0xe8eef5, 0x5a6048, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(-120, 160, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 1, far: 700 });
sun.shadow.bias = -0.0005;
scene.add(sun);

function meshFrom(d, opts = {}) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(d.pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(d.col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, ...opts }));
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}

// Terrain
{
  const T = S.terrain, pos = [], col = [], idx = [];
  for (let j = 0; j < T.nz; j++) for (let i = 0; i < T.nx; i++) {
    const h = T.h[j * T.nx + i];
    pos.push(T.x0 + i * T.step, h, T.z0 + j * T.step);
    const n = (Math.sin(i * 12.9898 + j * 78.233) * 43758.5453) % 1;
    col.push(0.33 + n * 0.03, 0.45 + n * 0.04, 0.26);
  }
  for (let j = 0; j < T.nz - 1; j++) for (let i = 0; i < T.nx - 1; i++) {
    const a = j * T.nx + i, b = a + 1, c = a + T.nx, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  m.receiveShadow = true; scene.add(m);
}

meshFrom(S.walls);
meshFrom(S.roofs);
const roads = meshFrom(S.roads, { polygonOffset: true, polygonOffsetFactor: -1 });
roads.castShadow = false;
meshFrom(S.pavements).castShadow = false;

// Centre lines
{
  const mat = new THREE.LineDashedMaterial({ color: 0xf2f2f2, dashSize: 3, gapSize: 6 });
  for (const line of S.marks) {
    const g = new THREE.BufferGeometry().setFromPoints(line.map(p => new THREE.Vector3(...p)));
    const l = new THREE.Line(g, mat); l.computeLineDistances(); scene.add(l);
  }
}
// Party walls
{
  const pts = S.party.flat();
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x1c1512 })));
}
// Trees (from LiDAR canopy peaks)
{
  const n = S.trees.length;
  const canopy = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshLambertMaterial({ color: 0x40562f, flatShading: true }), n);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18, 0.25, 1, 6), new THREE.MeshLambertMaterial({ color: 0x4a3b2c }), n);
  canopy.castShadow = trunk.castShadow = true;
  const M = new THREE.Matrix4(), q = new THREE.Quaternion();
  S.trees.forEach(([x, y, z, h], i) => {
    // Canopy fills the top ~60% of the LiDAR height, like a UK street/garden tree
    const r = Math.min(Math.max(h * 0.3, 1.4), 7.5);
    const cy = y + h - r * 0.9, trunkH = Math.max(cy - y, 1);
    M.compose(new THREE.Vector3(x, cy, z), q, new THREE.Vector3(r, r * 1.15, r)); canopy.setMatrixAt(i, M);
    M.compose(new THREE.Vector3(x, y + trunkH / 2, z), q, new THREE.Vector3(1 + h / 25, trunkH, 1 + h / 25)); trunk.setMatrixAt(i, M);
  });
  scene.add(canopy, trunk);
}

const labelDiv = document.getElementById("labels");
const labels = S.labels.map(l => { const d = document.createElement("div"); d.textContent = l.text; labelDiv.appendChild(d); return [d, new THREE.Vector3(...l.pos)]; });
function placeLabels() {
  for (const [d, p] of labels) {
    const v = p.clone().project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    d.style.display = vis ? "block" : "none";
    d.style.left = ((v.x + 1) / 2 * innerWidth) + "px";
    d.style.top = ((1 - v.y) / 2 * innerHeight) + "px";
  }
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let frames = 0;
renderer.setAnimationLoop(() => {
  controls.update(); renderer.render(scene, camera); placeLabels();
  if (++frames === 3) window.__ready = true;
});
</script>
</body>
</html>
